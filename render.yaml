services:
  - type: web
    name: asilbek-sensei-free
    runtime: node
    plan: free
    rootDir: render-app
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/lessons
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
